# Supp configuration
# Place at /etc/supp/config.toml — all values below are defaults unless noted.

[server]
data_dir = "/var/lib/supp"
# Public DNS name pointing at this VPS (A/AAAA record).
# Required for automatic HTTPS certificates and per-device DoH URLs.
domain = ""

[dns]
timeout = "3s"
edns_client_subnet = false

# Upstreams are tried in order of health/latency. Schemes: doh:// dot:// udp:// tcp://
[[dns.upstreams]]
url = "doh://dns.quad9.net/dns-query"
weight = 3

[[dns.upstreams]]
url = "doh://cloudflare-dns.com/dns-query"
weight = 2

[[dns.upstreams]]
url = "udp://9.9.9.9:53"
weight = 1

# Plain-IP resolvers used only to resolve upstream hostnames at startup.
[dns.bootstrap]
bootstrap = ["9.9.9.9", "149.112.112.112"]

[dns.cache]
size = 65536
min_ttl = "60s"
max_ttl = "24h"
fail_ttl = "30s"

[dns.listen]
plain = "0.0.0.0:53"
dot = "0.0.0.0:853"
doh = "0.0.0.0:443"

# Blocking: HaGeZi Normal is a good default. Add more lists below.
[block]
enabled = true
refresh = "24h"
block_ipv6 = true
response_ip = "0.0.0.0"

[[block.lists]]
name = "stevenblack"
url = "https://raw.githubusercontent.com/StevenBlack/hosts/master/hosts"
format = "hosts"

# Optional extra lists (uncomment to enable):
# [[block.lists]]
# name = "oisd"
# url = "https://big.oisd.nl/domainswild"
# format = "domains"

# Domains that must never be blocked (suffix match):
# allowlist = ["example.com"]

# Domains always blocked on top of lists:
# denylist = ["telemetry.example.net"]

# Admin dashboard. Token is generated by `supp init`.
[admin]
enabled = true
listen = "127.0.0.1:8080"
token = ""

# Privacy: query logging is OFF by default. When off, only anonymous
# per-day counters are kept. Enabling queries=true stores domains in
# top_domains/query_log for 24h top-lists and live search.
[log]
queries = false
retention = "720h"
counters_only = true
